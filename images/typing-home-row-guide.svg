<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title description">
  <title id="title">Home row keyboard finger guide</title>
  <desc id="description">Finger positions for the A S D F and J K L semicolon home row keys.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#e6f4f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#17324d" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1000" height="320" rx="24" fill="url(#background)"/>
  <text x="50" y="48" fill="#1665a7" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">HOME ROW POSITION</text>
  <text x="50" y="75" fill="#475467" font-family="Arial, sans-serif" font-size="16">Rest your fingers on A S D F and J K L ;</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(56 101)">
      <rect width="92" height="80" rx="14" fill="#2563eb"/>
      <text x="46" y="52" fill="#fff" font-size="34" font-weight="700">A</text>
    </g>
    <g transform="translate(164 101)">
      <rect width="92" height="80" rx="14" fill="#1688d4"/>
      <text x="46" y="52" fill="#fff" font-size="34" font-weight="700">S</text>
    </g>
    <g transform="translate(272 101)">
      <rect width="92" height="80" rx="14" fill="#0f9fae"/>
      <text x="46" y="52" fill="#fff" font-size="34" font-weight="700">D</text>
    </g>
    <g transform="translate(380 101)">
      <rect width="92" height="80" rx="14" fill="#0b9f7c"/>
      <text x="46" y="52" fill="#fff" font-size="34" font-weight="700">F</text>
      <rect x="33" y="66" width="26" height="3" rx="1.5" fill="#d9fff4"/>
    </g>
    <g transform="translate(528 101)">
      <rect width="92" height="80" rx="14" fill="#e79a24"/>
      <text x="46" y="52" fill="#fff" font-size="34" font-weight="700">J</text>
      <rect x="33" y="66" width="26" height="3" rx="1.5" fill="#fff2c9"/>
    </g>
    <g transform="translate(636 101)">
      <rect width="92" height="80" rx="14" fill="#ed7a36"/>
      <text x="46" y="52" fill="#fff" font-size="34" font-weight="700">K</text>
    </g>
    <g transform="translate(744 101)">
      <rect width="92" height="80" rx="14" fill="#e85b61"/>
      <text x="46" y="52" fill="#fff" font-size="34" font-weight="700">L</text>
    </g>
    <g transform="translate(852 101)">
      <rect width="92" height="80" rx="14" fill="#d8497b"/>
      <text x="46" y="52" fill="#fff" font-size="34" font-weight="700">;</text>
    </g>
  </g>

  <g fill="#667085" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="102" y="211">PINKY</text>
    <text x="210" y="211">RING</text>
    <text x="318" y="211">MIDDLE</text>
    <text x="426" y="211">INDEX</text>
    <text x="574" y="211">INDEX</text>
    <text x="682" y="211">MIDDLE</text>
    <text x="790" y="211">RING</text>
    <text x="898" y="211">PINKY</text>
  </g>

  <path d="M500 101v116" stroke="#8ca6b7" stroke-width="2" stroke-dasharray="5 7"/>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="168" y="245" width="270" height="45" rx="22.5" fill="#dceaff"/>
    <text x="303" y="273" fill="#1d62a9">LEFT HAND</text>
    <rect x="562" y="245" width="270" height="45" rx="22.5" fill="#ffe4de"/>
    <text x="697" y="273" fill="#ad4a40">RIGHT HAND</text>
  </g>
</svg>
